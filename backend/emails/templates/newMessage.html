<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Message Received - GigCampus</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            padding: 40px 20px;
            text-align: center;
            color: #ffffff;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.025em;
        }
        .body {
            padding: 40px;
        }
        .body p {
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        .message-box {
            background-color: #f8fafc;
            border-left: 4px solid #2563eb;
            border-radius: 4px 16px 16px 4px;
            padding: 24px;
            margin-bottom: 24px;
            font-style: italic;
            font-size: 15px;
            line-height: 1.6;
            color: #475569;
        }
        .cta-container {
            text-align: center;
            margin: 32px 0;
        }
        .btn {
            background-color: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            transition: all 0.2s ease;
        }
        .footer {
            background-color: #f8fafc;
            padding: 24px 40px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #64748b;
        }
        .footer a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>New Message Received</h1>
        </div>
        <div class="body">
            <p>Hello {{username}},</p>
            <p>You received a new message from <strong>@{{senderName}}</strong> regarding the project: <strong>"{{projectTitle}}"</strong>.</p>
            
            <div class="message-box">
                "{{messageContent}}"
            </div>

            <div class="cta-container">
                <a href="{{actionUrl}}" class="btn" target="_blank">Reply to Message</a>
            </div>
        </div>
        <div class="footer">
            <p>GigCampus Inc. • Campus Freelance Hub</p>
            <p>To control message alert preferences, visit your <a href="{{settingsUrl}}">Settings</a>.</p>
        </div>
    </div>
</body>
</html>
